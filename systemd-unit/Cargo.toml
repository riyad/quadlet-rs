[package]
name = "systemd-unit"
version = "0.3.0"
authors = ["Riyad Preukschas <riyad@informatik.uni-bremen.de>"]
edition = "2024"
description = "Systemd unit file parser"
license = "MPL-2.0"
keywords = ["systemd"]
categories = ["config", "parser-implementations"]

[lib]
path = "lib.rs"

[features]
log = []

[dependencies]
log = { workspace = true }
ordered-multimap = { workspace = true }
thiserror = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
tempfile = { workspace = true }
